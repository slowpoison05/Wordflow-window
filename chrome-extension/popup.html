<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WordFlow</title><link rel="stylesheet" href="popup.css"></head>
<body>
<h1>WordFlow</h1>
<p class="sub">BROWSER KEYBOARD</p>
<label for="text">Text to write</label>
<textarea id="text" rows="6" placeholder="Optional fallback text. Normally, copy text and use the right-click WordFlow menu."></textarea>
<label for="mode">Default mode</label>
<select id="mode"><option value="character">Character mode</option><option value="word">Word mode</option></select>
<label for="speed">Typing speed</label>
<select id="speed"><option value="fast">Fast</option><option value="normal">Normal</option><option value="slow">Slow</option></select>
<button id="save">Save fallback text and settings</button>
<button id="write">Write to last focused webpage field</button>
<div id="shortcut" role="status">Checking shortcut registration…</div>
<div id="status">Focus a webpage text field, copy text, then use the shortcut or the Write button. If the shortcut is not registered, set it at chrome://extensions/shortcuts.</div>
<script src="popup.js"></script>
</body></html>
